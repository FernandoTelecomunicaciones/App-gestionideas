name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # gradlew was committed from Windows without its executable bit (git mode 100644).
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew
      # No signing secrets here on purpose: without keystore.properties / AHORA_KEYSTORE_* the release build is
      # simply unsigned (D-35). The production key never enters CI.
      - name: Unit tests, lint, debug build and R8 release build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
